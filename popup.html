<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>DriverFlag</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" width="28" height="28" />
      <div>
        <h1>DriverFlag</h1>
        <p class="sub">Banderas de F1 en X</p>
      </div>
    </header>

    <label class="interruptor">
      <input type="checkbox" id="toggle" />
      <span>Activar banderas</span>
    </label>

    <p id="estado" class="estado">Leyendo el estado…</p>
    <p id="detalle" class="detalle"></p>

    <section class="cuentas" aria-labelledby="titulo-cuentas">
      <p id="titulo-cuentas" class="titulo-seccion">En qué cuentas funciona</p>

      <label class="opcion">
        <input type="radio" name="modo" value="todas" id="modo-todas" />
        <span>Todas mis cuentas</span>
      </label>
      <label class="opcion">
        <input type="radio" name="modo" value="lista" id="modo-lista" />
        <span>Solo estas cuentas</span>
      </label>

      <div id="bloque-lista" hidden>
        <ul id="lista-cuentas"></ul>
        <p id="lista-vacia" class="detalle">Aún no hay ninguna. Añade un usuario de X.</p>

        <div class="fila-agregar">
          <input
            type="text"
            id="nuevo-handle"
            placeholder="@usuario"
            maxlength="21"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" id="btn-agregar">Agregar</button>
        </div>
        <p id="error-handle" class="error" hidden></p>

        <button type="button" id="btn-cuenta-actual" class="secundario">
          Agregar la cuenta actual
        </button>
      </div>
    </section>

    <script src="cuentas.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
