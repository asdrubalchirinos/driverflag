<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>DriverFlag</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" width="28" height="28" />
      <div>
        <h1>DriverFlag</h1>
        <p class="sub">Banderas de F1 en X</p>
      </div>
    </header>

    <label class="interruptor">
      <input type="checkbox" id="toggle" />
      <span>Activar banderas</span>
    </label>

    <p id="estado" class="estado">Abre x.com para ver si está activa.</p>
    <p id="detalle" class="detalle"></p>

    <script src="popup.js"></script>
  </body>
</html>
